<section class="content-section my-3 bg-white shadow-sm rounded-xl" aria-labelledby="experience-heading">
    <h6 class="section-heading border-bottom border-gray p-3 mb-0" id="experience-heading">
        <i class="fas fa-briefcase mr-2" aria-hidden="true"></i>Work Experience
    </h6>
    <div class="p-3 p-md-4">
        {% for item in site.data.profile.experience %}
        <div class="work-entry">
            <div class="work-entry-heading">
                <div>
                    <h5 class="font-weight-normal mb-1">{{ item.name }}</h5>
                    <div class="text-muted">{{ item.position }}</div>
                </div>
                <div class="small text-muted work-entry-meta">
                    <div>{{ item.date }}</div>
                    <div>{{ item.dept }}</div>
                </div>
            </div>
            {% if item.description %}
            <p class="small text-muted mb-0 mt-3 work-description">{{ item.description }}</p>
            {% endif %}
        </div>
        {% endfor %}
    </div>
</section>
