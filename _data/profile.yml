short_bio: >-
  <p>
    I am a Master of Computing in Artificial Intelligence student at the
    <a href="https://www.nus.edu.sg/">National University of Singapore</a>.
    My work focuses on computer vision and multimodal learning, with recent industry experience
    developing vision-language-model-based workflows for industrial video understanding.
    I am particularly interested in vision-language models, multimodal perception, and reliable
    multimodal reasoning. My earlier research spans audio and speech machine learning, robust
    machine learning, and generative-model security. This background informs how I approach
    perception systems across modalities.
  </p>

