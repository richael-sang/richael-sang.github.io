  <p>
    Hi, I am Rui 👋, a Master of Computing in Artificial Intelligence student at the
    <a href="https://www.nus.edu.sg/">National University of Singapore</a>.
    I am interested in how machines can see, connect information across modalities,
    and reason more reliably. My current interests include computer vision, robust
    machine learning, multimodal learning, vision-language models, and audio processing.
    I enjoy turning open-ended ideas into careful experiments, and I am naturally curious,
    collaborative, and always happy to learn from a good technical puzzle. 🔍
  </p>

