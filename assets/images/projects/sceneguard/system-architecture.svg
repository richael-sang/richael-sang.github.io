<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">SceneGuard system architecture</title>
  <desc id="desc">Speech and acoustic scene context select scene-matched noise. A per-sample optimizer updates a temporal mask and global gain using a frozen ECAPA speaker encoder. The protected speech is evaluated with pretrained and objective metrics.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#587284"/>
    </marker>
    <style>
      .box{fill:#fff;stroke:#cbd6dc;stroke-width:2;rx:14}
      .accent{fill:#edf5f8;stroke:#7da2b8;stroke-width:2;rx:14}
      .output{fill:#edf7f1;stroke:#6c9b7d;stroke-width:2;rx:14}
      .group{fill:#f7f9fa;stroke:#dce4e8;stroke-width:2;stroke-dasharray:7 6;rx:18}
      .label{font:700 20px Lato,Arial,sans-serif;fill:#243746}
      .text{font:16px Lato,Arial,sans-serif;fill:#435866}
      .small{font:14px Lato,Arial,sans-serif;fill:#687c88}
      .group-title{font:700 15px Lato,Arial,sans-serif;fill:#315a75;letter-spacing:1px}
      .line{fill:none;stroke:#587284;stroke-width:2.5;marker-end:url(#arrow)}
      .feedback{fill:none;stroke:#a56f48;stroke-width:2.5;stroke-dasharray:7 5;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect width="1200" height="680" fill="#ffffff"/>

  <text x="55" y="48" class="group-title">INPUTS</text>
  <rect x="45" y="68" width="235" height="94" class="box"/>
  <text x="70" y="108" class="label">Speech x(t)</text>
  <text x="70" y="136" class="small">Published voice recording</text>

  <rect x="45" y="195" width="235" height="94" class="box"/>
  <text x="70" y="235" class="label">Scene s</text>
  <text x="70" y="263" class="small">PANNs CNN14 or user label</text>

  <rect x="45" y="322" width="235" height="94" class="box"/>
  <text x="70" y="362" class="label">Noise library N›</text>
  <text x="70" y="390" class="small">Scene-specific audio clips</text>

  <text x="355" y="48" class="group-title">SCENE-CONDITIONED SELECTION</text>
  <rect x="345" y="68" width="300" height="150" class="accent"/>
  <text x="375" y="113" class="label">Acoustic scene selection</text>
  <text x="375" y="145" class="text">Choose scene label</text>
  <text x="375" y="174" class="text">Sample n–(t) ~ N›</text>
  <text x="375" y="201" class="small">PANNs is pretrained; not updated</text>

  <text x="355" y="288" class="group-title">PER-SAMPLE MASK &amp; GAIN OPTIMIZATION</text>
  <rect x="335" y="306" width="530" height="278" class="group"/>
  <rect x="365" y="340" width="210" height="104" class="accent"/>
  <text x="391" y="378" class="label">Mixer</text>
  <text x="391" y="407" class="text">x2 = x + ³ m ™ n–</text>
  <text x="391" y="431" class="small">Optimize m(t) and ³ only</text>

  <rect x="625" y="340" width="210" height="104" class="box"/>
  <text x="651" y="378" class="label">ECAPA-TDNN</text>
  <text x="651" y="407" class="text">Speaker embeddings</text>
  <text x="651" y="431" class="small">Pretrained / frozen</text>

  <rect x="475" y="477" width="250" height="78" class="box"/>
  <text x="501" y="510" class="label">Default objective</text>
  <text x="501" y="538" class="small">SIM + smoothness + energy + SNR</text>

  <text x="925" y="48" class="group-title">OUTPUT &amp; EVALUATION</text>
  <rect x="915" y="68" width="240" height="104" class="output"/>
  <text x="943" y="109" class="label">Protected speech x2(t)</text>
  <text x="943" y="140" class="small">Audible, scene-matched noise</text>

  <rect x="915" y="224" width="240" height="134" class="box"/>
  <text x="943" y="264" class="label">Usability</text>
  <text x="943" y="294" class="text">Whisper Base · WER</text>
  <text x="943" y="322" class="text">STOI · PESQ</text>
  <text x="943" y="346" class="small">Evaluation only</text>

  <rect x="915" y="410" width="240" height="134" class="box"/>
  <text x="943" y="450" class="label">Robustness</text>
  <text x="943" y="480" class="text">MP3 · denoising</text>
  <text x="943" y="508" class="text">low-pass · downsampling</text>
  <text x="943" y="532" class="small">Recompute SIM after processing</text>

  <path d="M280 115 H345" class="line"/>
  <path d="M280 242 H315 V145 H345" class="line"/>
  <path d="M280 369 H315 V177 H345" class="line"/>
  <path d="M495 218 V270 H470 V340" class="line"/>
  <path d="M280 115 H310 V392 H365" class="line"/>
  <path d="M575 392 H625" class="line"/>
  <path d="M730 444 V477" class="line"/>
  <path d="M475 516 H438 V444" class="feedback"/>
  <path d="M575 392 H885 V120 H915" class="line"/>
  <path d="M1035 172 V224" class="line"/>
  <path d="M1035 358 V410" class="line"/>

  <rect x="45" y="620" width="1110" height="42" rx="10" fill="#fff7ed" stroke="#e8c79e"/>
  <text x="70" y="647" class="small">The pipeline does not train PANNs, ECAPA-TDNN, or Whisper. Gradient updates apply to the temporal mask m(t) and global gain ³ for each speech sample.</text>
</svg>
