  <text x="130" y="235" fill="#203541" font-family="Lato,Arial,sans-serif" font-size="72" font-weight="700">SceneGuard</text>
  <text x="130" y="285" fill="#647783" font-family="Lato,Arial,sans-serif" font-size="27">Scene-consistent audible protection for published speech</text>
